name: test

# The function serving R2 (bun test), the site generator, publish script and
# functions against wrangler pages dev and real apt and dnf in containers
# (e2e/), and shellcheck.
on:
  push:
    branches: [main]
    paths: &paths
      - scripts/**
      - site/**
      - e2e/**
      - repo/**
      - functions/**
      - src/**
      - wrangler.toml
      - go.mod
      - .github/workflows/test.yml
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
      - run: shellcheck scripts/*.sh site/install.sh
      - run: bun test src/
      - run: go test -count=1 -v ./e2e/
