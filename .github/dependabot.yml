# Pinned actions (commit SHAs) and wrangler (package-lock.json) stay current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # New versions wait a week: most compromised releases are found by then.
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # New versions wait a week: most compromised releases are found by then.
    cooldown:
      default-days: 7
